# ============================================================================
# Unikraft Cloud 镜像清理工作流 (支持指定多个镜像)
# ============================================================================
# 功能: 清理 unikraft.io 上存储的历史镜像，支持指定单/多个镜像或清空全部
# 
# 使用方式:
#   Actions -> Cleanup Unikraft Images -> Run workflow
# ============================================================================

name: Cleanup Unikraft Images

on:
  workflow_dispatch:
    inputs:
      cleanup_mode:
        description: '清理模式 (Cleanup Mode)'
        required: true
        type: choice
        options:
          - specified - 删除指定的镜像 (单/多个)
          - all - 删除所有镜像
        default: 'specified - 删除指定的镜像 (单/多个)'
      
      image_names:
        description: '镜像名称/Tag，多个用空格或逗号隔开 (如: jpus/node3sfo:latest jpus/app:v1)'
        required: false
        type: string
        default: ''
      
      confirm:
        description: '确认删除 (输入 DELETE 确认)'
        required: true
        type: string
        default: ''

jobs:
  cleanup:
    name: Cleanup Unikraft Images
    runs-on: ubuntu-latest
    
    steps:
      # ========================================
      # 步骤 1: 验证参数
      # ========================================
      - name: ✅ Validate Parameters
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "❌ 错误: 必须输入 DELETE 来确认删除操作"
            exit 1
          fi
          
          CLEANUP_MODE=$(echo "${{ inputs.cleanup_mode }}" | awk '{print $1}')
          echo "CLEANUP_MODE=$CLEANUP_MODE" >> $GITHUB_ENV
          
          if [ "$CLEANUP_MODE" = "specified" ]; then
            if [ -z "${{ inputs.image_names }}" ]; then
              echo "❌ 错误: 选择指定模式时必须提供至少一个镜像名称"
              exit 1
            fi
            echo "🎯 模式: 删除指定的镜像"
            echo "📦 目标: ${{ inputs.image_names }}"
          else
            echo "⚠️  模式: 删除所有镜像"
            echo "🚨 警告: 这将删除账号中的所有镜像！"
          fi

      # ========================================
      # 步骤 2: 安装 Unikraft CLI
      # ========================================
      - name: 🔧 Install Unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ========================================
      # 步骤 3: 登录 Unikraft Cloud
      # ========================================
      - name: 🔐 Login to Unikraft Cloud
        env:
          UKC_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: |
          if [ -z "$UKC_TOKEN" ]; then
            echo "❌ 错误: UNIKRAFT_TOKEN Secret 未设置"
            exit 1
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "${UKC_TOKEN}" | unikraft login --token - --no-browser

      # ========================================
      # 步骤 4: 列出当前镜像
      # ========================================
      - name: 📋 List Current Images
        env:
          UKC_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "📋 当前云端镜像列表:"
          unikraft images list 2>/dev/null || echo "没有存储的镜像"

      # ========================================
      # 步骤 5: 删除镜像
      # ========================================
      - name: 🗑️ Delete Image(s)
        env:
          UKC_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          
          if [ "${{ env.CLEANUP_MODE }}" = "specified" ]; then
            # ===== 处理并删除多个指定镜像 =====
            # 将逗号替换为空格，并按空格分割多个镜像名
            RAW_INPUT="${{ inputs.image_names }}"
            TARGET_IMAGES=$(echo "$RAW_INPUT" | tr ',' ' ')
            
            echo "🗑️  开始删除指定的镜像列表..."
            echo ""
            
            for img in $TARGET_IMAGES; do
              if [ -n "$img" ]; then
                echo "正在删除镜像: $img"
                if unikraft image remove "$img" 2>/dev/null || unikraft image rm "$img" 2>/dev/null; then
                  echo "  ✅ $img 删除成功"
                else
                  echo "  ❌ $img 删除失败 (可能不存在或格式错误)"
                fi
                echo ""
              fi
            done
            
          else
            # ===== 删除所有镜像 =====
            echo "🗑️  开始删除所有镜像..."
            IMAGES=$(unikraft images list 2>/dev/null | awk 'NR>1 {print $1}' | grep -v '^$')
            
            if [ -z "$IMAGES" ]; then
              echo "ℹ️  没有需要删除的镜像"
            else
              for img in $IMAGES; do
                if [ -n "$img" ]; then
                  echo "删除镜像: $img"
                  unikraft image remove "$img" 2>/dev/null || unikraft image rm "$img" 2>/dev/null || echo "  ⚠️  删除失败"
                fi
              done
            fi
          fi

      # ========================================
      # 步骤 6: 验证清理结果
      # ========================================
      - name: 🔍 Verify Cleanup Result
        if: always()
        env:
          UKC_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "🔍 验证清理后的镜像列表:"
          echo ""
          unikraft images list 2>/dev/null || true
